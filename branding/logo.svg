<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="194" ry="194" fill="none" stroke="#2a2a2a" stroke-width="3"/>

  <!-- Pixel-art lowercase β (Greek beta) in Minecraft (Mojangles) font style.
       7 cols x 12 rows, pixel = 80 units, offset (232, 32). Both bumps same width;
       descender continues from the left stem.

       Grid:
         .#####.    row 0 (top of upper bump)
         #.....#    row 1
         #.....#    row 2
         #.....#    row 3
         ######.    row 4 (junction: closes upper bump, starts lower bump)
         #.....#    row 5
         #.....#    row 6
         #.....#    row 7
         ######.    row 8 (closes lower bump)
         #......    row 9  -+
         #......    row 10  | descender
         #......    row 11 -+
  -->
  <g fill="#f2f2f2">
    <!-- Row 0: cols 1..5 -->
    <rect x="312" y="32"  width="80" height="80"/>
    <rect x="392" y="32"  width="80" height="80"/>
    <rect x="472" y="32"  width="80" height="80"/>
    <rect x="552" y="32"  width="80" height="80"/>
    <rect x="632" y="32"  width="80" height="80"/>

    <!-- Rows 1..3: col 0 (left stem) + col 6 (right edge of upper bump) -->
    <rect x="232" y="112" width="80" height="80"/>
    <rect x="712" y="112" width="80" height="80"/>
    <rect x="232" y="192" width="80" height="80"/>
    <rect x="712" y="192" width="80" height="80"/>
    <rect x="232" y="272" width="80" height="80"/>
    <rect x="712" y="272" width="80" height="80"/>

    <!-- Row 4: cols 0..5 (junction) -->
    <rect x="232" y="352" width="80" height="80"/>
    <rect x="312" y="352" width="80" height="80"/>
    <rect x="392" y="352" width="80" height="80"/>
    <rect x="472" y="352" width="80" height="80"/>
    <rect x="552" y="352" width="80" height="80"/>
    <rect x="632" y="352" width="80" height="80"/>

    <!-- Rows 5..7: col 0 (left stem) + col 6 (right edge of lower bump) -->
    <rect x="232" y="432" width="80" height="80"/>
    <rect x="712" y="432" width="80" height="80"/>
    <rect x="232" y="512" width="80" height="80"/>
    <rect x="712" y="512" width="80" height="80"/>
    <rect x="232" y="592" width="80" height="80"/>
    <rect x="712" y="592" width="80" height="80"/>

    <!-- Row 8: cols 0..5 (closes lower bump, same width as upper) -->
    <rect x="232" y="672" width="80" height="80"/>
    <rect x="312" y="672" width="80" height="80"/>
    <rect x="392" y="672" width="80" height="80"/>
    <rect x="472" y="672" width="80" height="80"/>
    <rect x="552" y="672" width="80" height="80"/>
    <rect x="632" y="672" width="80" height="80"/>

    <!-- Rows 9..11: col 0 only (descender) -->
    <rect x="232" y="752" width="80" height="80"/>
    <rect x="232" y="832" width="80" height="80"/>
    <rect x="232" y="912" width="80" height="80"/>
  </g>
</svg>
